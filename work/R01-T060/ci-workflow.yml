name: Test Portable Days Ago
on: [push, pull_request]

jobs:
  test-date:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Run days_ago.sh and compare with Python
        run: |
          for N in 0 1 7; do
            CALC_DATE=$(bash work/R01-T060/days_ago.sh "$N")
            PY_DATE=$(python3 -c "import datetime; print((datetime.date.today() - datetime.timedelta(days=$N)).strftime('%Y-%m-%d'))")
            echo "N=$N: Shell=$CALC_DATE, Python=$PY_DATE"
            [ "$CALC_DATE" = "$PY_DATE" ]
          done
